name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: shellcheck
        run: |
          shellcheck -S warning bin/kiwi install.sh get-kiwi.sh \
            data/kiwi-system-update data/bash-completion/kiwi \
            templates/install.sh tests/*.sh
      - name: the GUI has to at least parse
        run: python3 -m py_compile gui/kiwi-gui
      - name: release gate — version agrees, scripts executable in git
        run: bash tests/check-version.sh

  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # The same command the README and FIXPLAN tell a developer to run, rather
      # than a `container:` job: repro.sh needs root, useradd and a disposable
      # filesystem, and running it through docker here means CI exercises the
      # documented invocation instead of a second, untested one.
      - name: findings stay fixed
        run: |
          docker run --rm -v "$PWD":/src:ro fedora:latest bash -c \
            'dnf -y -q install git-core gawk util-linux shadow-utils procps-ng python3 openssl openssh-clients >/dev/null &&
             bash /src/tests/repro.sh'
